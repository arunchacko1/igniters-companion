# Production stack for the EC2 host. The image is pulled from GHCR and the
# database lives on RDS, so there is no local db service here — only the app.
#
# Expects a .env file alongside this one (see .env.production.example).
services:
  app:
    image: ghcr.io/arunchacko1/igniters-companion:latest
    restart: unless-stopped
    ports:
      - "80:3000"
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
