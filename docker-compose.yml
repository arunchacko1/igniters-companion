services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: igniters
      POSTGRES_USER: igniters
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igniters"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgres://igniters:secret@db:5432/igniters
      HF_HOME: /app/.cache/huggingface
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model-cache:/app/.cache/huggingface

volumes:
  pgdata:
  model-cache:
